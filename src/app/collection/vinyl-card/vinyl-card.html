<article class="vinyl-card">
  <a class="cover-link" [href]="'https://www.discogs.com/release/' + item().id" target="_blank" rel="noopener" [attr.aria-label]="item().artist + ' – ' + item().title + ' on Discogs'" (click)="onCardClick($event)">
    <div class="cover-wrapper">
      @if (isRedacted()) {
        <img
          class="cover cover-redacted"
          [src]="item().cover_url"
          [alt]="item().artist + ' – ' + item().title"
          loading="lazy"
          width="300"
          height="300"
        />
      } @else {
        <img
          class="cover"
          [src]="item().cover_url"
          [alt]="item().artist + ' – ' + item().title"
          loading="lazy"
          width="300"
          height="300"
        />
      }
    </div>
  </a>
</article>

@if (hovered()) {
  <div class="hover-popup" [style]="popupStyle()">
    <img
      class="popup-cover"
      [class.popup-cover-redacted]="isRedacted()"
      [src]="item().cover_url"
      [alt]="item().artist + ' – ' + item().title"
      width="220"
      height="220"
    />
    <div class="popup-info">
      <p class="popup-artist">{{ item().artist }}</p>
      <h2 class="popup-title">{{ item().title }}</h2>
      <p class="popup-meta">
        <span>{{ item().year }}</span>
        @if (item().label) {
          <span class="popup-separator" aria-hidden="true">&middot;</span>
          <span class="popup-label">{{ item().label }}</span>
        }
      </p>
    </div>
  </div>
}
