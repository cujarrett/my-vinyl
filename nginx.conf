server {
    listen 80;
    server_tokens off;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://i.discogs.com; script-src 'self'; connect-src 'self' https://my-vinyl-api.mattjarrett.dev; frame-ancestors 'none'; base-uri 'self';" always;

    root /usr/share/nginx/html;
    index index.html;

    location /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(js|css|woff2)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
